<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <title>Турниры · KT Companion</title>
  <link rel="icon" href="/brand/kt-companion/icon-32.png">
  <script src="/theme-boot.js?v=shared-34dae5ec08d8" data-companion-only></script>
  <link rel="stylesheet" href="/companion-tokens.css?v=shared-34dae5ec08d8">
  <link rel="stylesheet" href="/companion-shell.css?v=shared-34dae5ec08d8">
  <link rel="stylesheet" href="/miniapp/app.css?v=shared-34dae5ec08d8">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/miniapp/i18n.js?v=1.5.21" defer></script>
  <script src="/miniapp/link-flow.js?v=1.5.21" defer></script>
  <script src="/miniapp/app.js?v=1.5.21" defer></script>
</head>
<body data-companion-section="miniapp">
  <header class="mini-header">
    <div class="mini-header-inner">
      <a class="mini-brand" href="#tournament" aria-label="KT Companion — мой турнир" data-i18n-aria="KT Companion — мой турнир">
        <img data-companion-logo="mark" src="/brand/kt-companion/mark-dark.png" alt="" width="44" height="44">
        <span class="mini-brand-copy"><span class="companion-service-name">KT Companion</span><span class="companion-service-tool" data-i18n="Турнирная система">Турнирная система</span></span>
      </a>
      <div class="header-actions"><button type="button" id="theme-button" class="icon-button" aria-label="Переключить тему"></button><button type="button" id="refresh-button" class="icon-button" aria-label="Обновить данные" data-i18n-aria="Обновить данные"></button></div>
    </div>
  </header>
  <div class="mini-shell">
    <div id="connection" class="connection" role="status" hidden></div>
    <main id="content" tabindex="-1" aria-busy="true"><div class="loading"><span class="loader"></span><p data-i18n="Загружаем ваши турниры…">Загружаем ваши турниры…</p></div></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Разделы турниров" data-i18n-aria="Разделы турниров" hidden></nav>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title" data-i18n="Проверить результат">Проверить результат</h2><p id="confirm-copy"></p><div class="actions"><button value="cancel" class="secondary" data-i18n="Вернуться">Вернуться</button><button value="confirm" class="primary" data-i18n="Подтвердить">Подтвердить</button></div></form></dialog>
    <noscript><p class="notice">Для работы миниапа включите JavaScript. / Enable JavaScript to use the mini app.</p></noscript>
  </div>
</body>
</html>
