<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Единый аккаунт · KT Companion</title>
<script src="/theme-boot.js?v=shared-8b51f3d2bb3c" data-companion-only></script>
<link rel="icon" href="/brand/kt-companion/favicon.ico"><link rel="stylesheet" href="/companion-tokens.css?v=shared-8b51f3d2bb3c">
<link rel="stylesheet" href="/companion/css/common.css?v=shared-8b51f3d2bb3c"><link rel="stylesheet" href="/companion-shell.css?v=shared-8b51f3d2bb3c">
<link rel="stylesheet" href="/account/account.css?v=1.4.4">
<script src="/companion-sites.js?v=shared-8b51f3d2bb3c" defer></script><script src="/companion-i18n.js?v=shared-8b51f3d2bb3c" defer></script>
<script src="/companion-auth.js?v=shared-8b51f3d2bb3c" defer></script><script src="/companion-shell.js?v=shared-8b51f3d2bb3c" defer></script><script src="/account/account.js?v=shared-8b51f3d2bb3c" defer></script>
</head><body data-companion-section="account"><div data-companion-nav></div>
<main class="account-page"><a href="/">← Главное меню</a><h1>Единый аккаунт</h1><p>Один вход для всех разделов KT Companion.</p>
<p id="account-status" role="status" aria-live="polite">Проверяем вход…</p>
<section id="account-login" hidden><div class="account-modes"><button type="button" data-auth-mode="login" aria-pressed="true">Войти</button><button type="button" data-auth-mode="register" aria-pressed="false">Создать аккаунт</button></div>
<form id="account-auth-form">
<!-- shared-auth-fields:start -->
<label>Никнейм или почта<input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="1" maxlength="254" required></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="1" maxlength="256" required></label>
<fieldset id="account-registration" hidden disabled>
<label>Повторите пароль<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="256" required disabled></label>
<label>Telegram<input name="telegramContact" autocomplete="off" placeholder="@username" maxlength="80" required disabled></label>
<label id="account-email-label" hidden>Email<input name="email" type="email" autocomplete="email" maxlength="254" disabled></label>
</fieldset>
<!-- shared-auth-fields:end -->
<button id="account-submit" class="primary" type="submit">Войти</button></form><p><a href="/account-email.html#forgot">Забыли пароль?</a></p></section>
<section id="account-profile" hidden><h2 id="account-name" data-ui-skip></h2><form id="account-profile-form">
<label>Никнейм<input name="name" required maxlength="40" autocomplete="username"></label>
<label>Telegram<input name="telegramContact" required maxlength="80"></label><label>Регистрационное имя<input name="registerNickname" maxlength="40"></label>
<button type="submit" class="primary">Сохранить</button></form>
<p><a href="/account-email.html">Почта и восстановление доступа</a></p><p><a href="/tournament#/profile">Турнирный профиль и статистика</a></p></section>
</main></body></html>
