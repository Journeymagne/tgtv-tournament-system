<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Parser-blocking and tiny: stamps data-theme/lang before the first paint
         so a light-theme visitor does not see a dark page flip once the
         deferred app.js has parsed. Kept as a file, not inline, because the CSP
         is script-src 'self'. -->
    <script src="/theme-boot.js?v=20260906-tournament-buttons"></script>
    <title>TGTV Ranking Tournament System</title>
    <meta name="description" content="Kill Team rankings, tournament standings, matchmaking, match results, and All Kill Team Challenge tracking.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://rating.ktcompanion.ru/">
    <link rel="icon" type="image/png" href="/logo.png?v=20260808-favicon">
    <link rel="apple-touch-icon" href="/logo.png?v=20260808-favicon">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TGTV Ranking Tournament System">
    <meta property="og:title" content="TGTV Ranking Tournament System">
    <meta property="og:description" content="Kill Team rankings, tournament standings, matchmaking, match results, and All Kill Team Challenge tracking.">
    <meta property="og:url" content="https://rating.ktcompanion.ru/">
    <meta property="og:image" content="https://rating.ktcompanion.ru/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TGTV Ranking Tournament System">
    <meta name="twitter:description" content="Kill Team rankings, tournament standings, matchmaking, match results, and All Kill Team Challenge tracking.">
    <meta name="twitter:image" content="https://rating.ktcompanion.ru/logo.png">
    <link rel="stylesheet" href="/styles.css?v=20260906-tournament-buttons">
  </head>
  <body>
    <div id="app" class="app-shell">
      <div class="loading" aria-live="polite"></div>
    </div>
    <div class="floating-controls">
      <button class="lang-toggle" type="button" data-lang-toggle></button>
      <button class="theme-toggle" type="button" data-theme-toggle></button>
      <div class="notification-control" data-notification-control hidden>
        <button class="notification-toggle" type="button" data-notification-toggle aria-expanded="false" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path>
            <path d="M10 21h4"></path>
          </svg>
          <span class="notification-badge" data-notification-badge hidden></span>
        </button>
        <section class="notification-panel" data-notification-panel hidden></section>
      </div>
    </div>
    <script src="/game-data.js?v=20260906-tournament-buttons" defer></script>
    <!-- The locale dictionaries are not listed here: theme-boot.js writes a tag
         for the one the visitor is in, and app.js fetches the other only if
         somebody uses the language toggle. Listing both cost every visit
         110 KB to use half of it. -->
    <script src="/i18n.js?v=20260906-tournament-buttons" defer></script>
    <script src="/app.js?v=20260906-tournament-buttons" defer></script>
  </body>
</html>
