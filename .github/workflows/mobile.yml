name: Mobile

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - 'public/companion-tokens.css'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - 'public/companion-tokens.css'
  workflow_dispatch:
    inputs:
      native_build:
        description: Build a standalone Android sideload APK and an unsigned iOS simulator app
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ktcompanion.ru
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run tokens
      - name: Ensure generated tokens match canonical UI kit
        run: git diff --exit-code -- src/tokens.ts
      - run: npm run typecheck
      - name: API transport safety tests (CI only)
        run: npm run test:api
      - name: Bundle Android, iOS and web JavaScript
        run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-javascript-bundles
          path: mobile/dist
          retention-days: 7

  android:
    if: (github.event_name == 'workflow_dispatch' && inputs.native_build) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/mobile-tournaments')
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://ktcompanion.ru
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Assemble standalone sideload APK (development signing)
        working-directory: mobile/android
        run: bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: android-sideload-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    if: (github.event_name == 'workflow_dispatch' && inputs.native_build) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/mobile-tournaments')
    needs: bundle
    # SDK 58 uses the Xcode 27 toolchain; macos-26 currently defaults to Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://ktcompanion.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: mobile/ios
        run: pod install
      - name: Compile unsigned simulator app
        shell: bash
        run: |
          workspaces=(ios/*.xcworkspace)
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          apps=(build/Build/Products/Release-iphonesimulator/*.app)
          ditto -c -k --keepParent "${apps[0]}" ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
# Simulator apps are not signed IPA installers. Sideload APKs use the Expo-generated
# development signing key, not a production Play signing identity; JS is bundled.
# Native acceptance (session cookies, keyboard, TalkBack/VoiceOver, device rotation)
# remains separate from successful compilation.
