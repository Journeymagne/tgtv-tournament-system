name: Post-deploy application checks

on:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true
      release_tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA currently deployed to production
        type: string
        required: true
      release_tag:
        description: Optional deployed tag for checking both public changelogs
        type: string
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: All applications after deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.expected_sha }}
      DEPLOY_TAG: ${{ inputs.release_tag }}
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'https://ktcompanion.ru/' }}
      ANALYTICS_URL: ${{ vars.DEPLOY_ANALYTICS_URL || 'https://stats.ktcompanion.ru/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all application pages, APIs, assets and analytics
        run: node scripts/post-deploy-smoke.js
      - name: Save complete check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/post-deploy-smoke/
          if-no-files-found: warn
          retention-days: 14
