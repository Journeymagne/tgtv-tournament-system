# Include inside the public HTTPS server block. The dashboard is NOT exposed.
location = /telemetry/bootstrap.js {
    alias /app/ktcompanion-analytics/bootstrap.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
}
location = /telemetry/script.js {
    proxy_pass http://127.0.0.1:3010/script.js;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
}
location = /telemetry/api/send {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3010/api/send;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
}
location /telemetry/ { return 404; }
