# Enable only after stats.ktcompanion.ru resolves to this server and Certbot
# has issued a certificate. This is a separate server, never part of the app.
server {
    listen 80;
    server_name stats.ktcompanion.ru;
    location /.well-known/acme-challenge/ { root /app/ktcompanion-analytics/acme; }
    location / { return 301 https://stats.ktcompanion.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name stats.ktcompanion.ru;
    ssl_certificate /etc/letsencrypt/live/stats.ktcompanion.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.ktcompanion.ru/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
