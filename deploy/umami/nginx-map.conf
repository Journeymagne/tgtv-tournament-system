# http context (/etc/nginx/conf.d/ktcompanion-analytics.conf).
# Only HTML needs an uncompressed upstream response for injection. Preserve
# the application's cached compression for APIs and JavaScript/CSS/assets.
map $uri $kt_analytics_accept_encoding {
    default "";
    ~^/api/ $http_accept_encoding;
    ~*\.(?:js|css|json|svg|txt|xml|map|woff2?|ttf|png|jpe?g|gif|webp|ico|pdf)$ $http_accept_encoding;
}
